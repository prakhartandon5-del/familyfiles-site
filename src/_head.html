<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE_URL}}{{PATH}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="familyfiles">
<meta property="og:title" content="{{OG_TITLE}}">

<meta property="og:image:height" content="630">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preload" href="/fonts/source-serif-4-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script>document.documentElement.classList.remove('no-js')</script>

    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><i></i></span><span class="brand-name">familyfiles</span></a>
